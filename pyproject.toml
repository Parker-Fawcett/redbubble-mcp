[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redbubble-mcp"
version = "0.1.0"
description = "Redbubble MCP server - Model Context Protocol server that lets AI agents connect to your Redbubble artist account: upload designs, manage works, check sales and earnings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Business Fawcett" }]
requires-python = ">=3.10"
keywords = [
  "redbubble", "mcp", "mcp-server", "model-context-protocol", "fastmcp",
  "agent", "claude", "assistant", "print-on-demand", "pod", "automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Artistic Software",
]
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "playwright>=1.40",
]

[project.scripts]
redbubble-mcp = "redbubble_mcp.server:main"
redbubble-mcp-login = "redbubble_mcp.login:main"

[project.urls]
Homepage = "https://github.com/businessfawcett-cloud/redbubble-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
